name: granmap
description: "GranMap - Navegação indoor inteligente da Gran Tietê."
publish_to: 'none'
version: 1.4.0+9

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: 10.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  sensors_plus: ^7.1.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  camera: ^0.12.0+2
  mobile_scanner: ^7.4.0
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/maps/gran_tiete_upper_floorplan_v11.json
    - assets/branding/granmap_gt_icon_v1.png
    - assets/walkthroughs/entrada_gran/
    - assets/walkthroughs/rampa_superior/
    - assets/walkthroughs/agronomia/
    - assets/walkthroughs/entrada_tyto/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/granmap_gt_icon_v1.png
  adaptive_icon_background: "#071525"
  adaptive_icon_foreground: assets/branding/granmap_gt_foreground.png
  adaptive_icon_foreground_inset: 10
  min_sdk_android: 24
  remove_alpha_ios: true
