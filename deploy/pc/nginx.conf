map $http_cf_connecting_ip $granmap_client_ip {
    default $remote_addr;
    ~^[0-9a-fA-F:.]+$ $http_cf_connecting_ip;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    autoindex off;
    root /srv/app;
    index index.html;
    client_max_body_size 4m;

    include /etc/nginx/granmap_security_headers.conf;

    # Only the explicitly mounted release artifacts are visible to the Internet.
    location ~ (^|/)\. { return 404; }
    location ~* \.(env|db|sqlite|sqlite3|sql|pem|key|jks|keystore|log|docx|zip)$ { return 404; }

    location = /api { return 308 /api/; }
    location ~ ^/api/(metrics|docs|redoc|openapi.json)(/|$) { return 404; }
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cloudflare overwrites CF-Connecting-IP; arbitrary X-Forwarded-For is
        # discarded. The gateway's direct host port accepts loopback only.
        proxy_set_header X-Forwarded-For $granmap_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $granmap_client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/granmap_security_headers.conf;
    }

    location = /admin { return 308 /admin/; }
    location ^~ /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/granmap_security_headers.conf;
    }

    location = /instalar {
        alias /srv/install.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/granmap_security_headers.conf;
    }
    location = /baixar { return 302 /downloads/GranMap-Android-arm64.apk; }
    location = /downloads/GranMap-Android-arm64.apk {
        alias /srv/downloads/GranMap-Android-arm64.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="GranMap-Android-arm64.apk"' always;
        add_header Cache-Control "no-transform, no-cache" always;
        include /etc/nginx/granmap_security_headers.conf;
        gzip off;
        max_ranges 1;
    }
    location = /downloads/sha256.txt {
        alias /srv/downloads/sha256.txt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/granmap_security_headers.conf;
    }
    location /downloads/ { return 404; }

    # Browsers must revalidate the loader after a new deployment. Dart's offline
    # app cache remains local; versioned HTTP entrypoints are not immutable.
    location ~* \.(html|js|json|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/granmap_security_headers.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/granmap_security_headers.conf;
    }
}
