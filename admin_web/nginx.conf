server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /baixar {
        return 302 https://github.com/deywysonc/GranMap-Releases/releases/latest/download/GranMap-Android-arm64.apk;
    }

    location /downloads/ {
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="GranMap-Demo-v1.4.1-arm64-v8a.apk"' always;
        add_header Cache-Control "no-transform, public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
