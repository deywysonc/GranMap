<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050C17">
  <meta name="description" content="GranMap - Guia de salas, mapas 2D/3D e rotas da Faculdade Gran Tietê.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GranMap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GranMap</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050C17;
      color: #F4F7FB;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #granmap-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #050C17;
      transition: opacity 200ms ease;
    }
    .granmap-spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(47, 128, 255, 0.2);
      border-top-color: #FF6B00;
      animation: granmap-spin 0.8s linear infinite;
    }
    @keyframes granmap-spin {
      to { transform: rotate(360deg); }
    }
    .granmap-boot-label {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #C7D4E8;
    }
  </style>
</head>
<body>
  <div id="granmap-boot">
    <div class="granmap-spinner" aria-hidden="true"></div>
    <div class="granmap-boot-label">Abrindo GranMap...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('granmap-boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
