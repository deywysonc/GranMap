services:
  - type: web
    name: granmap-api-deywyson
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GRANMAP_ENVIRONMENT
        value: production
      - key: GRANMAP_DATABASE_URL
        sync: false
      - key: GRANMAP_PUBLIC_ORIGINS
        value: https://granmap-admin-deywyson.onrender.com
      - key: GRANMAP_COOKIE_SECURE
        value: "true"
      - key: GRANMAP_TRUSTED_PROXY_HEADERS
        value: "true"
      - key: GRANMAP_METRICS_ENABLED
        value: "true"
      - key: GRANMAP_COMMERCIAL_LAUNCH
        value: "false"
      - key: GRANMAP_ALLOW_REMOTE_DEMO_SEED
        value: "true"

  - type: web
    name: granmap-admin-deywyson
    runtime: static
    rootDir: admin_web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_GRANMAP_API_URL
        value: https://granmap-api-deywyson.onrender.com
      - key: VITE_GRANMAP_ADMIN_AUTH_MODE
        value: bearer
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
